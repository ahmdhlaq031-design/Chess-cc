<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>♛ Chess Master</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html{width:100%;min-height:100%;background:#0a0e1a;overflow-x:hidden;}
body{
    width:100%;min-height:100vh;min-height:100dvh;
    font-family:'Cairo','Segoe UI',sans-serif;
    color:#fff;overflow-x:hidden;position:relative;
    background:
        linear-gradient(180deg, rgba(10,14,26,0.82) 0%, rgba(15,21,36,0.78) 50%, rgba(8,11,20,0.88) 100%),
        url('https://i.ibb.co/cS43HTCF/5.jpg') center/cover no-repeat fixed;
}
body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,215,0,0.6), transparent),
        radial-gradient(1px 1px at 40% 90%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 80% 90%, rgba(200,180,255,0.6), transparent);
    animation:stars 20s linear infinite;
}
@keyframes stars{0%,100%{opacity:0.6}50%{opacity:1}}

.app{
    width:100%;max-width:600px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;
    gap:10px;padding:12px 10px 30px;position:relative;z-index:1;
}
.logo{text-align:center;margin:4px 0;width:100%;position:relative;padding:8px 0}
.logo h1{
    font-size:clamp(1.3rem,5.5vw,2rem);font-weight:900;
    background:linear-gradient(135deg,#ffd700 0%,#fff8dc 25%,#ffd700 50%,#c9a87b 75%,#ffd700 100%);
    background-size:200% 200%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:2px;line-height:1.2;
    animation:shine 4s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(255,215,0,0.6));
}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo .subtitle{
    color:#c9a87b;font-size:0.68rem;letter-spacing:5px;
    text-transform:uppercase;margin-top:2px;font-weight:700;
    text-shadow:0 0 10px rgba(201,168,123,0.7);
}
.menu-icon{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;font-size:20px;
    background:linear-gradient(145deg,rgba(30,41,59,0.92),rgba(15,23,42,0.92));
    color:#ffd700;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:2px solid rgba(201,168,123,0.7);z-index:9999;
    box-shadow:0 4px 25px rgba(255,215,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
    transition:transform 0.2s, box-shadow 0.2s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    will-change:transform;
}
.menu-icon:active{transform:scale(0.9);box-shadow:0 0 30px rgba(255,215,0,0.6)}
.side-menu{
    position:fixed;top:0;right:0;width:290px;max-width:88vw;
    height:100vh;height:100dvh;
    background:linear-gradient(180deg,rgba(20,26,42,0.98),rgba(10,15,26,0.99));
    border-left:2px solid rgba(201,168,123,0.6);
    padding:calc(20px + env(safe-area-inset-top)) 14px 30px;
    z-index:10000;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:8px;
    box-shadow:-15px 0 60px rgba(0,0,0,0.9);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transform:translate3d(100%,0,0);
    transition:transform 0.32s cubic-bezier(0.22,1,0.36,1);
    will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    contain:layout style paint;
}
.side-menu.open{transform:translate3d(0,0,0)}
.side-menu button{
    background:linear-gradient(145deg,rgba(44,58,74,0.85),rgba(30,40,54,0.85));
    border:1px solid rgba(201,168,123,0.3);padding:13px 14px;border-radius:12px;
    color:#f0e6d3;font-weight:700;font-size:0.88rem;cursor:pointer;
    width:100%;text-align:center;
    transition:background 0.15s, transform 0.15s;
    font-family:'Cairo',sans-serif;flex-shrink:0;
}
.side-menu button:active{background:linear-gradient(145deg,#c9772e,#a05a1e);transform:scale(0.97)}
.side-menu .active{background:linear-gradient(145deg,#c9772e,#a05a1e)!important;border-color:#ffd700!important;box-shadow:0 0 20px rgba(255,215,0,0.5)}
.side-menu hr{border:none;border-top:1px solid rgba(201,168,123,0.2);margin:4px 0;flex-shrink:0}
.close-btn{
    position:absolute;top:14px;left:14px;font-size:18px;
    background:rgba(255,215,0,0.1)!important;
    border:1px solid rgba(201,168,123,0.5)!important;
    color:#ffdfa5;width:38px!important;height:38px;
    padding:0!important;border-radius:50%!important;
    display:flex;align-items:center;justify-content:center;
}
#colorMenu .color-opt{padding:10px 6px;font-size:0.75rem}
#colorMenu .color-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9998;display:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;transition:opacity 0.28s ease;will-change:opacity;
}
.overlay.show{display:block;opacity:1}

.game-container{
    background:linear-gradient(145deg,rgba(42,36,24,0.95),rgba(26,21,16,0.95));
    padding:12px;border-radius:22px;border:2px solid transparent;background-clip:padding-box;
    box-shadow:0 25px 60px rgba(0,0,0,0.9),0 0 0 2px rgba(255,215,0,0.3),inset 0 1px 0 rgba(255,215,0,0.2),inset 0 -2px 8px rgba(0,0,0,0.6);
    width:100%;position:relative;
}
.board-wrapper{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,0.6)}
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);background:#b58863;user-select:none}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1/1;transition:background-color 0.15s;overflow:visible}
.cell.light{background:#f0d9b5}
.cell.dark{background:#1e1e1e}
.cell.selected{background:linear-gradient(135deg,#7b9c3e,#5a7a2a)!important;box-shadow:inset 0 0 0 3px #ffd700,inset 0 0 20px rgba(255,215,0,0.5)}
.cell.selected::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,215,0,0.3),transparent 70%);animation:selPulse 1s ease-in-out infinite}
@keyframes selPulse{0%,100%{opacity:0.5}50%{opacity:1}}
.cell.valid-move::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,1),rgba(255,215,0,0.3));box-shadow:0 0 15px rgba(255,215,0,0.9);pointer-events:none;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.25);opacity:0.5}}
.cell.valid-move.capture::after{width:88%;height:88%;background:transparent;border:3px solid rgba(255,60,60,0.9);box-shadow:0 0 20px rgba(255,60,60,0.8),inset 0 0 20px rgba(255,60,60,0.3);animation:capturePulse 1s ease-in-out infinite}
@keyframes capturePulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.1);opacity:1}}
.cell.check{background:radial-gradient(circle,#dc2626,#8b0000)!important;box-shadow:inset 0 0 0 3px #ff0000,0 0 25px rgba(255,0,0,0.8);animation:checkPulse 0.8s infinite}
@keyframes checkPulse{0%,100%{box-shadow:inset 0 0 0 3px #ff0000,0 0 20px rgba(255,0,0,0.6)}50%{box-shadow:inset 0 0 0 3px #ff0000,0 0 40px rgba(255,0,0,1)}}
.cell.last-move{background:rgba(255,215,0,0.15)!important;box-shadow:inset 0 0 0 2px rgba(255,215,0,0.5)}
.cell.last-move.light{background:linear-gradient(135deg,#f0d9b5,rgba(255,215,0,0.3))!important}
.cell.last-move.dark{background:linear-gradient(135deg,#1e1e1e,rgba(255,215,0,0.2))!important}
.piece{width:88%;height:88%;display:flex;align-items:center;justify-content:center;pointer-events:none;will-change:opacity;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));z-index:2;position:relative}
.piece svg{width:100%;height:100%;display:block}
.status{text-align:center;margin:12px 0 6px;font-weight:700;color:#ffefcf;background:linear-gradient(145deg,rgba(0,0,0,0.65),rgba(0,0,0,0.35));padding:11px 14px;border-radius:30px;font-size:clamp(0.8rem,3.5vw,0.95rem);min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(201,168,123,0.4);box-shadow:inset 0 2px 10px rgba(0,0,0,0.5);text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.thinking{display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.online-panel{
    display:none;margin-top:10px;width:100%;
    background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));
    padding:12px;border-radius:14px;border:1px solid rgba(201,168,123,0.4);
}
.online-panel.hidden{display:none!important}
.online-panel .row-input{display:flex;gap:8px;align-items:center;}
.online-panel input{
    padding:12px;border-radius:12px;border:2px solid rgba(201,168,123,0.5);
    background:rgba(15,23,42,0.95);color:#ffd700;flex:1;min-width:0;text-align:center;
    font-size:1.4rem;font-family:'Courier New',monospace;font-weight:900;letter-spacing:8px;
}
.online-panel input:focus{outline:none;border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,0.4)}
.online-panel input::placeholder{color:#4a5a6a;letter-spacing:2px;font-size:0.9rem}
.online-panel button{
    background:linear-gradient(145deg,#2c5f6e,#1a3a4a);border:1px solid rgba(201,168,123,0.4);
    padding:12px 16px;border-radius:12px;color:white;font-weight:700;cursor:pointer;
    font-size:0.85rem;font-family:'Cairo',sans-serif;transition:all 0.15s;
    display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
}
.online-panel button:active{transform:scale(0.95)}
.online-panel button:disabled{opacity:0.4;cursor:not-allowed}
.online-panel .status-text{color:#ffd700;font-size:0.75rem;text-align:center;font-weight:700;word-break:break-all;margin-top:8px;min-height:16px;}

.captured-wrapper{position:relative;width:100%;display:flex;justify-content:center;margin-top:10px;}
.captured-btn{
    background:linear-gradient(145deg,rgba(30,41,59,0.95),rgba(15,23,42,0.95));
    border:1px solid rgba(201,168,123,0.6);color:#ffd700;
    padding:10px 22px;border-radius:30px;font-family:'Cairo',sans-serif;
    font-weight:700;font-size:0.85rem;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform 0.15s, box-shadow 0.2s;will-change:transform;
}
.captured-btn:active{transform:scale(0.95)}
.captured-btn .badge{
    background:linear-gradient(145deg,#c9772e,#a05a1e);color:#fff;
    font-size:0.68rem;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;font-weight:900;
}
.captured-btn .caret{font-size:0.7rem;transition:transform 0.28s ease;display:inline-block;}
.captured-btn.open .caret{transform:rotate(180deg)}
.captured-dropdown{
    position:absolute;top:calc(100% + 8px);left:50%;
    transform:translateX(-50%) translateY(-8px) scale(0.96);
    transform-origin:top center;width:min(92vw,420px);
    background:linear-gradient(145deg,rgba(26,30,44,0.98),rgba(15,20,32,0.98));
    border:1px solid rgba(201,168,123,0.55);border-radius:16px;
    box-shadow:0 15px 50px rgba(0,0,0,0.8),0 0 30px rgba(255,215,0,0.15);
    padding:10px 12px;opacity:0;pointer-events:none;
    transition:opacity 0.22s ease, transform 0.22s cubic-bezier(0.22,1,0.36,1);
    z-index:500;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    will-change:transform, opacity;
}
.captured-dropdown.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1);}
.captured-dropdown .section{padding:6px 4px;}
.captured-dropdown .section + .section{border-top:1px solid rgba(201,168,123,0.18);margin-top:4px;padding-top:10px;}
.captured-dropdown .label{color:#c9a87b;font-size:0.72rem;font-weight:700;margin-bottom:6px;display:block;}
.captured-dropdown .row{display:flex;flex-wrap:wrap;gap:3px;min-height:26px;align-items:center;}
.captured-dropdown .row svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));}
.captured-dropdown .empty{color:#5a6a7a;font-size:0.72rem;font-style:italic;}

.promotion-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.88);
    display:flex;justify-content:center;align-items:center;
    z-index:11000;backdrop-filter:blur(8px);padding:20px;
}
.promotion-box{
    background:linear-gradient(145deg,#2d2a24,#1a1814);
    padding:22px 20px;border-radius:22px;text-align:center;
    border:2px solid #ffd700;max-width:360px;width:100%;
    box-shadow:0 0 60px rgba(255,215,0,0.4);
}
.promotion-box h3{color:#ffdfa5;margin-bottom:16px;font-size:1.05rem}
.promotion-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.promotion-btn{background:linear-gradient(145deg,#4b3b2c,#2a2018);border:1px solid rgba(201,168,123,0.4);padding:12px;border-radius:14px;cursor:pointer;color:white;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.promotion-btn svg{width:44px;height:44px}
.promotion-btn span{font-size:0.75rem;font-weight:700;color:#ffd700}
.promotion-btn:active{transform:scale(0.95);background:#c9772e}

.winner-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.92);
    display:flex;justify-content:center;align-items:center;
    z-index:12000;backdrop-filter:blur(12px);padding:20px;
}
.winner-box{
    background:linear-gradient(145deg,#2d2a24,#1a1814);
    padding:32px 24px;border-radius:24px;text-align:center;
    border:3px solid #ffd700;max-width:360px;width:100%;
    box-shadow:0 0 80px rgba(255,215,0,0.5);
    animation:winnerPop 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes winnerPop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}
.winner-box .emoji{font-size:4.5rem;margin-bottom:10px;line-height:1;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.winner-box h2{color:#ffd700;font-size:1.6rem;margin-bottom:20px;text-shadow:0 0 20px rgba(255,215,0,0.5)}
.winner-box button{
    background:linear-gradient(145deg,#c9772e,#a05a1e);border:none;
    padding:13px 30px;border-radius:30px;color:white;font-weight:700;
    font-size:0.95rem;cursor:pointer;font-family:'Cairo',sans-serif;
    box-shadow:0 4px 20px rgba(201,119,46,0.5);
}
.winner-box button:active{transform:scale(0.95)}

.toast{
    position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%) translateY(120px);
    background:linear-gradient(145deg,#2d2a24,#1a1814);
    color:#ffd700;padding:11px 22px;border-radius:30px;
    border:1px solid #ffd700;font-weight:700;font-size:0.85rem;
    box-shadow:0 10px 40px rgba(0,0,0,0.8);
    transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index:13000;max-width:90vw;text-align:center;will-change:transform;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:360px){
    .app{padding:8px 6px 25px;gap:8px}
    .game-container{padding:9px}
    .captured-dropdown .row svg{width:22px;height:22px}
}
</style>
</head>
<body>

<div class="logo">
    <h1>♛ CHESS MASTER ♛</h1>
    <div class="subtitle">شطرنج احترافي</div>
</div>

<div class="menu-icon" id="menuIcon">☰</div>

<div class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeMenuBtn">✖</button>
    <button id="vsComputerBtn">🤖 ضد الكمبيوتر</button>
    <button id="vsLocalBtn">👥 ضد صديق</button>
    <button id="vsOnlineBtn">📡 ضد صديق (أونلاين)</button>
    <hr>
    <button id="diffMediumBtn">⚡ متوسط</button>
    <button id="diffHardBtn">🔥 صعب</button>
    <button id="diffInsaneBtn">💀 مستحيل</button>
    <hr>
    <button id="openColorsBtn">🎨 الألوان</button>
</div>

<div class="side-menu" id="colorMenu" style="z-index:10001">
    <button class="close-btn" id="closeColorBtn">✖</button>
    <button class="close-btn" id="backFromColorBtn" style="left:60px;font-size:12px;background:#5a4a3a!important;border-radius:30px!important;padding:6px 12px!important;width:auto!important;height:auto!important">↩️ رجوع</button>
    <hr>
    <div class="color-grid">
        <button class="color-opt" data-dark="#1e1e1e">⬜ أبيض & أسود</button>
        <button class="color-opt" data-dark="#b58863">🟫 أبيض & بني</button>
        <button class="color-opt" data-dark="#c0392b">🟥 أبيض & أحمر</button>
        <button class="color-opt" data-dark="#27ae60">🟩 أبيض & أخضر</button>
        <button class="color-opt" data-dark="#2980b9">🟦 أبيض & أزرق</button>
        <button class="color-opt" data-dark="#8e44ad">🟪 أبيض & بنفسجي</button>
        <button class="color-opt" data-dark="#d35400">🟧 أبيض & برتقالي</button>
        <button class="color-opt" data-dark="#e84393">🩷 أبيض & وردي</button>
        <button class="color-opt" data-dark="#00b894">💚 أبيض & فيروزي</button>
        <button class="color-opt" data-dark="#a67c52">🤎 أبيض & بني غامق</button>
        <button class="color-opt" data-dark="#b7950b">💛 أبيض & ذهبي</button>
        <button class="color-opt" data-dark="#2c3e50">🌑 أبيض & كحلي</button>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="overlay" id="overlayColor"></div>

<div class="app">
    <div class="game-container">
        <div class="board-wrapper">
            <div class="board" id="chessboard"></div>
        </div>
        <div class="status" id="statusMsg">♔ الأبيض يبدأ</div>

        <div class="online-panel" id="onlinePanel">
            <div class="row-input">
                <input type="text" id="roomInput" placeholder="123" maxlength="3" inputmode="numeric" pattern="[0-9]*" />
                <button id="createRoomBtn">➕</button>
                <button id="joinRoomBtn">🔗</button>
            </div>
            <div class="status-text" id="roomStatus"></div>
        </div>
    </div>

    <div class="captured-wrapper">
        <button class="captured-btn" id="capturedBtn">
            🍽️ المأكولات
            <span class="badge" id="capturedBadge">0</span>
            <span class="caret">▼</span>
        </button>
        <div class="captured-dropdown" id="capturedDropdown">
            <div class="section">
                <span class="label">⬜ مأكولات الأبيض (القطع السوداء)</span>
                <div class="row" id="capturedWhiteList"><span class="empty">لا يوجد</span></div>
            </div>
            <div class="section">
                <span class="label">⬛ مأكولات الأسود (القطع البيضاء)</span>
                <div class="row" id="capturedBlackList"><span class="empty">لا يوجد</span></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
// ==========================================================
// SVG القطع

let board = Array(8).fill().map(()=>Array(8).fill(null));
let turn = 'white';
let gameMode = 'computer';
let difficulty = 'medium';
let selectedRow = null, selectedCol = null;

let winner = null;
let pendingPromotion = null;

let blackRookMoved={left:false,right:false};

let peer=null, conn=null, isMyTurn=true;
let computerTimeout=null;
let myColor='white';

const pieceValue={pawn:1,knight:3,bishop:3,rook:5,queen:9,king:100};

let cellElements=[];
let isAnimating=false;

function showToast(msg,duration=2200){
    let t=document.createElement('div');
    t.className='toast';t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(()=>setTimeout(()=>t.classList.add('show'),10));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},duration);
}

// ========== تحديد اللون الذي يتحكم به اللاعب ==========
function getPlayerColor(){
    if(gameMode==='computer') return 'white';
    if(gameMode==='online') return myColor;
    return turn; // local: اللاعب الحالي
}

// هل يمكن للاعب الحالي تحريك قطعة من هذا اللون؟
function canPlayerMove(color){
    if(gameOver) return false;
    if(gameMode==='computer') return color==='white' && turn==='white';
    if(gameMode==='online') return color===myColor && isMyTurn && turn===myColor;
    // local: أي دور يقدر يحرك اللون المطابق لدوره فقط
    return color===turn;
}

function initBoard(){
    let b=Array(8).fill().map(()=>Array(8).fill(null));
    for(let i=0;i<8;i++){b[1][i]='black_pawn';b[6][i]='white_pawn';}
    const order=['rook','knight','bishop','queen','king','bishop','knight','rook'];
    for(let i=0;i<8;i++){b[0][i]=`black_${order[i]}`;b[7][i]=`white_${order[i]}`;}
    whiteKingMoved=false;blackKingMoved=false;
    whiteRookMoved={left:false,right:false};
    blackRookMoved={left:false,right:false};
    capturedWhite=[];capturedBlack=[];lastMove=null;
    return b;
}
function copyBoard(b){return b.map(r=>[...r]);}
function findKing(b,color){
    for(let i=0;i<8;i++)for(let j=0;j<8;j++)
        if(b[i][j]===`${color}_king`)return[i,j];
    return null;
}
function isSquareUnderAttack(r,c,b,defendingColor){
    const attacker=defendingColor==='white'?'black':'white';
    for(let i=0;i<8;i++)for(let j=0;j<8;j++){
        let p=b[i][j];
        if(p&&p.startsWith(attacker)){
            if(isValidMoveBasic(p,i,j,r,c,b))return true;
        }
    }
    return false;
}
function isKingInCheck(b,color){
    let k=findKing(b,color);
    if(!k)return false;
    return isSquareUnderAttack(k[0],k[1],b,color);
}
function isValidCastling(color,kFrom,kTo,rFrom,rTo,b){
    if(color==='white'&&whiteKingMoved)return false;
    if(color==='black'&&blackKingMoved)return false;
    if(color==='white'){
        if(kTo[1]===6&&whiteRookMoved.right)return false;
        if(kTo[1]===2&&whiteRookMoved.left)return false;
    }else{
        if(kTo[1]===6&&blackRookMoved.right)return false;
        if(kTo[1]===2&&blackRookMoved.left)return false;
    }
    // التحقق من أن الملك والقلعة في الصف الصحيح
    let kingRow=color==='white'?7:0;
    if(kFrom[0]!==kingRow || rFrom[0]!==kingRow) return false;
    // التحقق من عدم وجود قطع بين الملك والقلعة
    let step=kTo[1]>kFrom[1]?1:-1;
    for(let c=kFrom[1]+step;c!==kTo[1];c+=step)if(b[kFrom[0]][c])return false;
    // التحقق من أن الملك ليس تحت الهجوم في المسار
    if(isSquareUnderAttack(kFrom[0],kFrom[1],b,color))return false;
    if(isSquareUnderAttack(kFrom[0],kFrom[1]+step,b,color))return false;
    if(isSquareUnderAttack(kTo[0],kTo[1],b,color))return false;
    return true;
}
function executeCastling(color,kingRow,rookCol,newKingCol,newRookCol){
    board[kingRow][4]=null; // موقع الملك الأصلي
    board[kingRow][rookCol]=null;
    board[kingRow][newKingCol]=`${color}_king`;
    board[kingRow][newRookCol]=`${color}_rook`;
    if(color==='white')whiteKingMoved=true;else blackKingMoved=true;
}
function isValidMoveBasic(piece,fromR,fromC,toR,toC,b){
    if(toR<0||toR>7||toC<0||toC>7)return false;
    let target=b[toR][toC];
    if(target&&target.split('_')[0]===piece.split('_')[0])return false;
    let dr=toR-fromR,dc=toC-fromC;
    let type=piece.split('_')[1],color=piece.split('_')[0];
    if(type==='pawn'){
        let dir=color==='white'?-1:1;
        let startRow=color==='white'?6:1;
        if(dc===0&&!target&&dr===dir)return true;
        if(dc===0&&!target&&dr===2*dir&&fromR===startRow&&!b[fromR+dir][fromC])return true;
        if(Math.abs(dc)===1&&dr===dir&&target&&target.split('_')[0]!==color)return true;
        return false;
    }
    if(type==='rook')return(dr===0||dc===0)&&isClearLine(fromR,fromC,toR,toC,b);
    if(type==='bishop')return(Math.abs(dr)===Math.abs(dc))&&isClearLine(fromR,fromC,toR,toC,b);
    if(type==='queen')return((dr===0||dc===0)||(Math.abs(dr)===Math.abs(dc)))&&isClearLine(fromR,fromC,toR,toC,b);
    if(type==='knight')return(Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2);
    if(type==='king'){
        if(Math.abs(dr)<=1&&Math.abs(dc)<=1)return true;
        if(dr===0&&Math.abs(dc)===2){
            let rookCol=dc===2?7:0;
            let rookPiece=b[fromR][rookCol];
            if(rookPiece&&rookPiece===`${color}_rook`){
                let newKingCol=fromC+(dc>0?2:-2);
                let newRookCol=dc>0?fromC+1:fromC-1;
                return isValidCastling(color,[fromR,fromC],[fromR,newKingCol],[fromR,rookCol],[fromR,newRookCol],b);
            }
        }
        return false;
    }
    return false;
}
function isClearLine(r1,c1,r2,c2,b){
    let dr=r2===r1?0:(r2>r1?1:-1);
    let dc=c2===c1?0:(c2>c1?1:-1);
    let r=r1+dr,c=c1+dc;
    while(!(r===r2&&c===c2)){
        if(b[r][c])return false;
        r+=dr;c+=dc;
    }
    return true;
}
function isMoveSafe(piece,fromR,fromC,toR,toC,b,color){
    let temp=copyBoard(b);
    temp[toR][toC]=temp[fromR][fromC];
    temp[fromR][fromC]=null;
    if(piece.split('_')[1]==='king'&&Math.abs(toC-fromC)===2){
        let rookCol=toC>fromC?7:0;
        let newRookCol=toC>fromC?toC-1:toC+1;
        temp[fromR][newRookCol]=temp[fromR][rookCol];
        temp[fromR][rookCol]=null;
    }
    return !isKingInCheck(temp,color);
}
function isValidMoveFull(piece,fromR,fromC,toR,toC,b,color){
    if(!isValidMoveBasic(piece,fromR,fromC,toR,toC,b))return false;
    return isMoveSafe(piece,fromR,fromC,toR,toC,b,color);
}
function getAllValidMoves(color,b){
    let moves=[];
    for(let i=0;i<8;i++)for(let j=0;j<8;j++){
        let p=b[i][j];
        if(p&&p.startsWith(color)){
            for(let ti=0;ti<8;ti++)for(let tj=0;tj<8;tj++){
                if(isValidMoveFull(p,i,j,ti,tj,b,color))
                    moves.push({from:[i,j],to:[ti,tj],piece:p});
            }
        }
    }
    return moves;
}
function getGameState(b,currentTurn){
    let inCheck=isKingInCheck(b,currentTurn);
    let hasMoves=getAllValidMoves(currentTurn,b).length>0;
    if(inCheck&&!hasMoves)return'checkmate';
    if(!inCheck&&!hasMoves)return'stalemate';
    if(inCheck)return'check';
    return'normal';
}
function setGameOver(winnerColor){
    gameOver=true;winner=winnerColor;
    updateStatus();
    setTimeout(showWinnerScreen,500);
}
function showWinnerScreen(){
    let overlay=document.createElement('div');
    overlay.className='winner-overlay';
    let emoji=winner==='تعادل'?'🤝':'🏆';
    let text=winner==='تعادل'?'تعادل!':`فاز ${winner}!`;
    overlay.innerHTML=`<div class="winner-box">
        <div class="emoji">${emoji}</div>
        <h2>${text}</h2>
        <button id="newGameFromWinner">لعبة جديدة</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#newGameFromWinner').onclick=()=>{overlay.remove();resetGame();};
}
function showPromotionDialog(row,col,color){
    pendingPromotion={row,col,color};
    let dialog=document.createElement('div');
    dialog.className='promotion-overlay';
    dialog.innerHTML=`<div class="promotion-box"><h3>✨ اختر الترقية</h3><div class="promotion-buttons">
        <button class="promotion-btn" data-piece="queen">${PIECE_SVG[color+'_queen']}<span>وزير</span></button>
        <button class="promotion-btn" data-piece="rook">${PIECE_SVG[color+'_rook']}<span>قلعة</span></button>
        <button class="promotion-btn" data-piece="bishop">${PIECE_SVG[color+'_bishop']}<span>فيل</span></button>
        <button class="promotion-btn" data-piece="knight">${PIECE_SVG[color+'_knight']}<span>حصان</span></button>
    </div></div>`;
    document.body.appendChild(dialog);
    dialog.querySelectorAll('.promotion-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            let type=btn.getAttribute('data-piece');
            board[row][col]=`${color}_${type}`;
            dialog.remove();
            pendingPromotion=null;
            // الدور تم تبديله مسبقاً في makeMove، لذا لا نغيره هنا
            let state=getGameState(board,turn);
            if(state==='checkmate')setGameOver(turn==='white'?'الأسود':'الأبيض');
            else if(state==='stalemate'){gameOver=true;winner='تعادل';updateStatus();setTimeout(showWinnerScreen,500);}
            renderBoard();updateStatus();
            // تشغيل الكمبيوتر إذا كان دوره
            if(gameMode==='computer'&&turn==='black'&&!gameOver)scheduleComputerMove();
            // إرسال الحالة أونلاين
            if(gameMode==='online')sendGameState();
        });
    });
}
function getComputerMove(){
    let moves=getAllValidMoves('black',board);
    if(!moves.length)return null;
    let scored=moves.map(m=>{
        let score=0;
        let target=board[m.to[0]][m.to[1]];
        if(target&&target.startsWith('white'))score+=(pieceValue[target.split('_')[1]]||0)*10;
        let temp=copyBoard(board);
        temp[m.to[0]][m.to[1]]=temp[m.from[0]][m.from[1]];
        temp[m.from[0]][m.from[1]]=null;
        if(isKingInCheck(temp,'white'))score+=50;
        if(isKingInCheck(temp,'black'))score-=30;
        let centerDist=Math.abs(m.to[0]-3.5)+Math.abs(m.to[1]-3.5);
        score+=(7-centerDist)*0.5;
        return{move:m,score};
    });
    scored.sort((a,b)=>b.score-a.score);
    if(difficulty==='medium'){
        let top=Math.max(1,Math.floor(scored.length*0.4));
        return scored[Math.floor(Math.random()*top)].move;
    }else if(difficulty==='hard'){
        let top=Math.max(1,Math.floor(scored.length*0.2));
        return scored[Math.floor(Math.random()*top)].move;
    }else return scored[0].move;
}
function scheduleComputerMove(){
    if(computerTimeout)clearTimeout(computerTimeout);
    computerTimeout=setTimeout(()=>{
        if(gameMode==='computer'&&turn==='black'&&!gameOver&&!pendingPromotion){
            let move=getComputerMove();
            if(move)makeMove(move.from[0],move.from[1],move.to[0],move.to[1],true);
        }
    },350);
}
function makeMove(fromR,fromC,toR,toC,fromAI=false){
    if(gameOver||isAnimating)return false;
    let piece=board[fromR][fromC];
    if(!piece||piece.split('_')[0]!==turn)return false;
    let target=board[toR][toC];
    if(target&&target.split('_')[0]===turn)return false;
    if(!isValidMoveFull(piece,fromR,fromC,toR,toC,board,turn))return false;

    // حفظ معلومات الاستيلاء
    if(target){
        let color=target.split('_')[0],type=target.split('_')[1];
        if(color==='white')capturedBlack.push(type); else capturedWhite.push(type);
    }
    let color=turn;
    let isKing=piece.split('_')[1]==='king';
    let isRook=piece.split('_')[1]==='rook';
    let isCastling=isKing&&Math.abs(toC-fromC)===2;

    isAnimating=true;
    animateMove(fromR,fromC,toR,toC,piece,()=>{
        if(isCastling){
            // التبييت: نقل الملك والقلعة
            let kingRow=fromR;
            let rookCol=toC>fromC?7:0;
            let newKingCol=toC;
            let newRookCol=toC>fromC?5:3;
            board[kingRow][fromC]=null;
            board[kingRow][rookCol]=null;
            board[kingRow][newKingCol]=`${color}_king`;
            board[kingRow][newRookCol]=`${color}_rook`;
            if(color==='white'){whiteKingMoved=true;if(toC>fromC)whiteRookMoved.right=true;else whiteRookMoved.left=true;}
            else{blackKingMoved=true;if(toC>fromC)blackRookMoved.right=true;else blackRookMoved.left=true;}
        }else{
            board[toR][toC]=piece;
            board[fromR][fromC]=null;
            if(isKing){if(color==='white')whiteKingMoved=true;else blackKingMoved=true;}
            if(isRook){
                if(color==='white'){if(fromC===0)whiteRookMoved.left=true;if(fromC===7)whiteRookMoved.right=true;}
                else{if(fromC===0)blackRookMoved.left=true;if(fromC===7)blackRookMoved.right=true;}
            }
        }
        lastMove={from:[fromR,fromC],to:[toR,toC]};
        let isPawn=piece.split('_')[1]==='pawn';
        let reachedEnd=isPawn&&((turn==='white'&&toR===0)||(turn==='black'&&toR===7));
        let originalTurn=turn;
        // تبديل الدور فوراً
        turn=turn==='white'?'black':'white';
        selectedRow=null;
        selectedCol=null;
        isAnimating=false;

        if(reachedEnd){
            // نعرض الترقية، والدور الآن للخصم بالفعل
            renderBoard();
            showPromotionDialog(toR,toC,originalTurn);
            updateStatus();
            return;
        }
        let state=getGameState(board,turn);
        if(state==='checkmate')setGameOver(turn==='white'?'الأسود':'الأبيض');
        else if(state==='stalemate'){gameOver=true;winner='تعادل';updateStatus();setTimeout(showWinnerScreen,500);}
        renderBoard();
        updateStatus();
        if(gameMode==='computer'&&turn==='black'&&!gameOver&&!pendingPromotion)scheduleComputerMove();
        if(gameMode==='online'&&!fromAI)sendGameState();
    });
    return true;
}
function animateMove(fromR,fromC,toR,toC,piece,callback){
    let boardEl=document.getElementById('chessboard');
    if(!boardEl) { if(callback) callback(); return; }
    let fromCell=boardEl.children[fromR*8+fromC];
    let toCell=boardEl.children[toR*8+toC];

    if(!fromCell || !toCell) { if(callback) callback(); return; }

    let fromRect=fromCell.getBoundingClientRect();
    let toRect=toCell.getBoundingClientRect();
    let dx=toRect.left-fromRect.left;
    let dy=toRect.top-fromRect.top;

    let origPieceEl=fromCell.querySelector('.piece');
    let capturedEl=toCell.querySelector('.piece');
    if(origPieceEl) origPieceEl.style.opacity='0';
    if(capturedEl) capturedEl.style.opacity='0';

    let flyingPiece=document.createElement('div');
    flyingPiece.style.cssText=`
        position:fixed;
        left:${fromRect.left}px;
        top:${fromRect.top}px;
        width:${fromRect.width}px;
        height:${fromRect.height}px;
        z-index:999;
        pointer-events:none;
        display:flex;
        align-items:center;
        justify-content:center;
        transform:translate3d(0,0,0);
        transition:transform 0.2s cubic-bezier(0.3,0.7,0.4,1);
        will-change:transform;
        backface-visibility:hidden;
        -webkit-backface-visibility:hidden;
    `;
    flyingPiece.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6%;filter:drop-shadow(0 8px 12px rgba(0,0,0,0.5));">${PIECE_SVG[piece]}</div>`;
    document.body.appendChild(flyingPiece);

    requestAnimationFrame(()=>{
        flyingPiece.style.transform=`translate3d(${dx}px,${dy}px,0)`;
    });

    setTimeout(()=>{
        flyingPiece.remove();
        if(callback)callback();
    },200);
}
function renderBoard(){
    let container=document.getElementById('chessboard');
    if(container.children.length!==64){
        container.innerHTML='';
        cellElements=[];
        for(let i=0;i<8;i++){
            for(let j=0;j<8;j++){
                let cell=document.createElement('div');
                let isLight=(i+j)%2===0;
                cell.className=`cell ${isLight?'light':'dark'}`;
                cell.addEventListener('click',(function(r,c){return function(){onCellClick(r,c);};})(i,j));
                container.appendChild(cell);
                cellElements.push(cell);
            }
        }
    }
    let inCheck=!gameOver&&isKingInCheck(board,turn);
    let kingPos=findKing(board,turn);

    for(let i=0;i<8;i++){
        for(let j=0;j<8;j++){
            let piece=board[i][j];
            let cell=cellElements[i*8+j];
            let isLight=(i+j)%2===0;
            let cls=`cell ${isLight?'light':'dark'}`;
            if(selectedRow===i&&selectedCol===j)cls+=' selected';
            if(inCheck&&kingPos&&kingPos[0]===i&&kingPos[1]===j)cls+=' check';
            if(lastMove&&((lastMove.from[0]===i&&lastMove.from[1]===j)||(lastMove.to[0]===i&&lastMove.to[1]===j)))cls+=' last-move';
            if(selectedRow!==null&&selectedCol!==null&&!gameOver){
                let sel=board[selectedRow][selectedCol];
                if(sel&&isValidMoveFull(sel,selectedRow,selectedCol,i,j,board,turn)){
                    cls+=' valid-move';
                    if(board[i][j])cls+=' capture';
                }
            }
            if(cell.className!==cls) cell.className=cls;
            let targetBg=isLight?currentLight:currentDark;
            if(cell.style.backgroundColor!==targetBg) cell.style.backgroundColor=targetBg;

            let existingPiece=cell.firstChild;
            if(piece){
                if(existingPiece&&existingPiece.classList&&existingPiece.classList.contains('piece')){
                    if(existingPiece.dataset.piece!==piece){
                        existingPiece.dataset.piece=piece;
                        existingPiece.innerHTML=PIECE_SVG[piece];
                    }
                    if(existingPiece.style.opacity!=='1') existingPiece.style.opacity='1';
                }else{
                    if(existingPiece) existingPiece.remove();
                    let pieceEl=document.createElement('div');
                    pieceEl.className='piece';
                    pieceEl.dataset.piece=piece;
                    pieceEl.innerHTML=PIECE_SVG[piece];
                    cell.appendChild(pieceEl);
                }
            }else{
                if(existingPiece) existingPiece.remove();
            }
        }
    }
    updateCapturedDisplay();
}
function updateCapturedDisplay(){
    let wl=document.getElementById('capturedWhiteList');
    let bl=document.getElementById('capturedBlackList');
    let badge=document.getElementById('capturedBadge');
    if(wl){
        if(capturedWhite.length===0){
            wl.innerHTML='<span class="empty">لا يوجد</span>';
        }else{
            wl.innerHTML=capturedWhite.map(t=>
                `<span style="display:inline-block;width:26px;height:26px;">${PIECE_SVG['black_'+t]}</span>`
            ).join('');
        }
    }
    if(bl){
        if(capturedBlack.length===0){
            bl.innerHTML='<span class="empty">لا يوجد</span>';
        }else{
            bl.innerHTML=capturedBlack.map(t=>
                `<span style="display:inline-block;width:26px;height:26px;">${PIECE_SVG['white_'+t]}</span>`
            ).join('');
        }
    }
    if(badge) badge.textContent=(capturedWhite.length+capturedBlack.length);
}

// ========== التحقق من صلاحية لعب اللاعب الحالي ==========
function isPlayerAllowedToMove(){
    if(gameOver) return false;
    if(gameMode==='computer') return turn==='white';
    if(gameMode==='online') return isMyTurn && turn===myColor;
    return true; // local: أي دور
}

function onCellClick(row,col){
    if(gameOver){showToast("اللعبة انتهت!");return;}
    if(pendingPromotion){showToast("أكمل الترقية أولاً");return;}
    if(isAnimating) return;

    // منع اللاعب من التحريك خارج دوره
    if(!isPlayerAllowedToMove()){
        if(gameMode==='computer') showToast("انتظر دورك (الكمبيوتر يلعب)");
        else if(gameMode==='online') showToast("ليس دورك");
        return;
    }

    // منع تحريك قطع الخصم
    let piece=board[row][col];
    if(selectedRow===null){
        if(piece){
            let pieceColor=piece.split('_')[0];
            // التحقق من أن القطعة تخص دور اللاعب الحالي
            if(!canPlayerMove(pieceColor)){
                showToast("لا يمكنك تحريك قطع الخصم");
                return;
            }
            selectedRow=row;selectedCol=col;
            renderBoard();
        }
    }else{
        // إذا نقر على قطعة من نفس لون اللاعب الحالي -> تحديدها
        if(piece){
            let pieceColor=piece.split('_')[0];
            if(canPlayerMove(pieceColor)){
                selectedRow=row;selectedCol=col;
                renderBoard();
                return;
            }
        }
        makeMove(selectedRow,selectedCol,row,col);
    }
}
function updateStatus(){
    let el=document.getElementById('statusMsg');
    if(gameOver){
        el.innerHTML=winner==='تعادل'?'🤝 جمود! تعادل':`🏆 كش مات! الفائز: ${winner}`;
        return;
    }
    let inCheck=isKingInCheck(board,turn);
    let msg=`دور: ${turn==='white'?'⬜ الأبيض':'⬛ الأسود'}`;
    if(inCheck)msg+=' ⚠️ كش ملك!';
    if(gameMode==='computer'&&turn==='black'&&!gameOver)msg+=' <span class="thinking">🤖 يفكر...</span>';
    if(gameMode==='online')msg+=isMyTurn?' - 🟢 دورك':' - ⏳ انتظر';
    el.innerHTML=msg;
}
function setColors(light,dark){currentLight=light;currentDark=dark;renderBoard();}

// PeerJS (بدون تغيير)
// ==========================================================
const PEER_CONFIG={
    config:{iceServers:[
        {urls:'stun:stun.l.google.com:19302'},
        {urls:'stun:stun1.l.google.com:19302'},
        {urls:'stun:stun2.l.google.com:19302'},
        {urls:'stun:stun3.l.google.com:19302'},
        {urls:'stun:stun4.l.google.com:19302'},
        {urls:'stun:global.stun.twilio.com:3478'}
    ]},
    debug:1
};

function hideOnlinePanel(){
    let panel = document.getElementById('onlinePanel');
    panel.classList.add('hidden');
    panel.style.display = 'none';
}
function showOnlinePanel(){
    let panel = document.getElementById('onlinePanel');
    panel.classList.remove('hidden');
    panel.style.display = 'block';
    document.getElementById('roomStatus').textContent = '';
    document.getElementById('roomInput').value = '';
    document.getElementById('createRoomBtn').disabled = false;
    document.getElementById('joinRoomBtn').disabled = false;
    document.getElementById('roomInput').disabled = false;
}
function lockOnlineControls(){
    document.getElementById('createRoomBtn').disabled = true;
    document.getElementById('joinRoomBtn').disabled = true;
    document.getElementById('roomInput').disabled = true;
}
function initPeer(cb){
    if(peer&&!peer.destroyed){if(cb)cb();return;}
    try{
        peer=new Peer(PEER_CONFIG);
        peer.on('open',id=>{if(cb)cb();});
        peer.on('connection',c=>{conn=c;setupConnection(c);});
        peer.on('error',e=>{
            console.warn('Peer error:',e);
            if(e.type==='unavailable-id'){joinWithCode(document.getElementById('roomInput').value);}
        });
        peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
    }catch(e){showToast('❌ فشل الاتصال');}
}
function setupConnection(c){
    conn=c;
    conn.on('open',()=>{
        document.getElementById('roomStatus').textContent='✅ متصل!';
        showToast('✅ تم الاتصال بالخصم');
        hideOnlinePanel();
        if(gameMode==='online'){isMyTurn=(turn===myColor);sendGameState();}
    });
    conn.on('data',d=>{
        try{
            let msg=typeof d==='string'?JSON.parse(d):d;
            if(msg.type==='state'){
                board=msg.board;turn=msg.turn;
                gameOver=msg.gameOver||false;winner=msg.winner||null;
                capturedWhite=msg.capturedWhite||[];capturedBlack=msg.capturedBlack||[];
                whiteKingMoved=msg.whiteKingMoved||false;
                blackKingMoved=msg.blackKingMoved||false;
                whiteRookMoved=msg.whiteRookMoved||{left:false,right:false};
                blackRookMoved=msg.blackRookMoved||{left:false,right:false};
                lastMove=msg.lastMove||null;
                isMyTurn=(turn===myColor);
                renderBoard();updateStatus();
                if(gameOver&&winner&&!document.querySelector('.winner-overlay'))setTimeout(showWinnerScreen,500);
            }else if(msg.type==='color'){
                myColor=msg.color;isMyTurn=(turn===myColor);updateStatus();
            }else if(msg.type==='reset'){
                resetGame(true);
            }
        }catch(e){console.warn('Parse error:',e);}
    });
    conn.on('close',()=>{
        showToast('🔴 انقطع الاتصال');
        document.getElementById('roomStatus').textContent='❌ منقطع';
        conn=null;
        showOnlinePanel();
    });
    conn.on('error',()=>{
        document.getElementById('roomStatus').textContent='⚠️ خطأ في الاتصال';
    });
}
function createRoom(){
    let code = document.getElementById('roomInput').value.trim();
    if(!code || code.length !== 3){showToast('📝 أدخل كود 3 أرقام');return;}
    if(!/^\d{3}$/.test(code)){showToast('📝 الكود يجب أن يكون 3 أرقام');return;}
    document.getElementById('roomStatus').textContent = '⏳ جاري إنشاء الغرفة...';
    lockOnlineControls();
    let peerId = 'chess-room-' + code;
    if(peer&&!peer.destroyed){try{peer.destroy();}catch(e){}}
    peer = null;
    myColor = 'white';
    peer = new Peer(peerId, PEER_CONFIG);
    peer.on('open', pid=>{
        document.getElementById('roomStatus').textContent = '⏳ انتظر الخصم...';
        showToast('🌟 تم إنشاء الغرفة - انشر الكود: ' + code);
        peer.on('connection', c=>{
            conn = c;
            setupConnection(c);
            setTimeout(()=>{
                if(conn && conn.open){
                    conn.send(JSON.stringify({type:'color',color:'black'}));
                }
            }, 500);
        });
    });
    peer.on('error', e=>{
        console.warn('Create room error:', e);
        if(e.type === 'unavailable-id'){
            showToast('⚠️ الكود محجوز، اختر كوداً آخر');
            document.getElementById('roomStatus').textContent = '❌ الكود مستخدم';
            document.getElementById('createRoomBtn').disabled = false;
            document.getElementById('joinRoomBtn').disabled = false;
            document.getElementById('roomInput').disabled = false;
        } else {
            showToast('❌ فشل إنشاء الغرفة');
            document.getElementById('roomStatus').textContent = '❌ فشل';
            document.getElementById('createRoomBtn').disabled = false;
            document.getElementById('joinRoomBtn').disabled = false;
            document.getElementById('roomInput').disabled = false;
        }
    });
}
function joinRoom(){
    let code = document.getElementById('roomInput').value.trim();
    if(!code || code.length !== 3){showToast('📝 أدخل كود 3 أرقام');return;}
    if(!/^\d{3}$/.test(code)){showToast('📝 الكود يجب أن يكون 3 أرقام');return;}
    joinWithCode(code);
}
function joinWithCode(code){
    document.getElementById('roomStatus').textContent = '⏳ جاري الاتصال...';
    lockOnlineControls();
    myColor = 'black';
    if(peer&&!peer.destroyed){try{peer.destroy();}catch(e){}}
    peer = null;
    peer = new Peer(PEER_CONFIG);
    peer.on('open', ()=>{
        let c = peer.connect('chess-room-' + code, {reliable:true});
        conn = c;
        setupConnection(c);
        let connected = false;
        let timeout = setTimeout(()=>{
            if(connected) return;
            showToast('❌ فشل الاتصال - تأكد من الكود');
            document.getElementById('roomStatus').textContent = '❌ فشل الاتصال';
            if(peer){try{peer.destroy();}catch(e){}peer=null;}
            document.getElementById('createRoomBtn').disabled = false;
            document.getElementById('joinRoomBtn').disabled = false;
            document.getElementById('roomInput').disabled = false;
        }, 10000);
        c.on('open', ()=>{
            connected = true;
            clearTimeout(timeout);
            document.getElementById('roomStatus').textContent = '✅ متصل!';
            isMyTurn = (turn === myColor);
            sendGameState();
        });
        c.on('error', ()=>{
            clearTimeout(timeout);
            if(!connected){
                showToast('❌ فشل الاتصال');
                document.getElementById('roomStatus').textContent = '❌ فشل';
                document.getElementById('createRoomBtn').disabled = false;
                document.getElementById('joinRoomBtn').disabled = false;
                document.getElementById('roomInput').disabled = false;
            }
        });
    });
    peer.on('error', e=>{
        console.warn('Join error:', e);
        showToast('❌ خطأ في الاتصال');
        document.getElementById('roomStatus').textContent = '❌ خطأ';
        document.getElementById('createRoomBtn').disabled = false;
        document.getElementById('joinRoomBtn').disabled = false;
        document.getElementById('roomInput').disabled = false;
    });
}
function sendGameState(){
    if(conn&&conn.open){
        try{conn.send(JSON.stringify({
            type:'state',board,turn,gameOver,winner,capturedWhite,capturedBlack,
            whiteKingMoved,blackKingMoved,whiteRookMoved,blackRookMoved,lastMove
        }));}catch(e){}
    }
}

function resetGame(silent=false){
    if(computerTimeout)clearTimeout(computerTimeout);
    board=initBoard();
    turn='white';selectedRow=null;selectedCol=null;
    gameOver=false;winner=null;pendingPromotion=null;isAnimating=false;
    document.querySelectorAll('.winner-overlay').forEach(el=>el.remove());
    document.querySelectorAll('.promotion-overlay').forEach(el=>el.remove());
    renderBoard();updateStatus();
    if(gameMode==='computer'&&turn==='black')scheduleComputerMove();
    if(gameMode==='online'&&!silent){isMyTurn=(turn===myColor);sendGameState();}
}
function updateMenuStates(){
    document.querySelectorAll('#sideMenu button').forEach(b=>b.classList.remove('active'));
    if(gameMode==='computer')document.getElementById('vsComputerBtn').classList.add('active');
    if(gameMode==='local')document.getElementById('vsLocalBtn').classList.add('active');
    if(gameMode==='online')document.getElementById('vsOnlineBtn').classList.add('active');
    if(difficulty==='medium')document.getElementById('diffMediumBtn').classList.add('active');
    if(difficulty==='hard')document.getElementById('diffHardBtn').classList.add('active');
    if(difficulty==='insane')document.getElementById('diffInsaneBtn').classList.add('active');
}

resetGame();
updateMenuStates();
hideOnlinePanel();
</script>
</body>
</html>
